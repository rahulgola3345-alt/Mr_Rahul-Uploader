name: Telegram Bot Runner

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2

      - name: Install All Downloader Modules
        run: |
          pip install --upgrade pip
          pip install m3u8 requests yt-dlp pyrogram tgcrypto aiohttp aiofiles motor python-dotenv beautifulsoup4 mutagen ffmpeg-python cryptography pycryptodome cloudscraper PyYaml Pillow urllib3 pscript pipreqs
          pip install pywidevine shaka-packager
          pipreqs . --force || true
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Run Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python modules/main.py
